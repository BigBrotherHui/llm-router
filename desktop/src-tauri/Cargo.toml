[package]
name = "llm-router-desktop"
version = "2.10.0"
description = "llm-router desktop shell"
edition = "2021"

[lib]
name = "llm_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
rand = "0.8"
chrono = "0.4"
async-stream = "0.3"
base64 = "0.22"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
