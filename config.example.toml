# --- 同一个厂商的多个账号（用来分摊额度）---
# 就把同一个地址写多组，不同名字。然后在模型路由里选「轮流轮询」。
# 一个账号可以被好几个分组共用，所以每天上限配在这里（上游级），
# 配额是共用的一份 —— 分组各写一套的话，同一个账号能用的总次数会被
# 重复计数，上限就白设了。
#
# user_agent 一般不用写（默认 llm-router/<版本>）。有些上游按客户端 UA
# 放行，UA 不对直接 401（如 agentrouter 报 "unauthorized client detected"），
# 这种就填它白名单里的 UA，例如：claude-cli/2.0.30 (external, cli)
# [[upstreams]]
# name = "官方账号2"
# id = "u5"
# base_url = "https://api.deepseek.com"
# api_key = "sk-第二个账号的key"
# max_per_day = 100       # 本地自然日最多 100 次（不写/0 = 不限；日期一变清零）
# user_agent = "..."      # 自定义 User-Agent（不写 = 默认）


# ---------------------------------------------------------------------------
# 多线路（同一家的多个域名 / 镜像）
#
# 很多中转会给同一套模型、同一个 Key 一堆域名（api.xxx.com、us-v1.xxx.com、
# hk-v1.xxx.com…），线路快慢差别很大。把 base_urls 填上之后：
#   · 每个请求自动走「当前最快」的那一条
#   · 某一条连不上 / 超时 / 回 5xx，自动换下一条（还没给客户端吐字节之前才换，
#     所以不会重复扣费、不会重复生成）
#   · 后台每 15 秒并发探一遍全部线路，空闲时排名也是新的
#   · 某条域名根本没有 API（/models 回 404）会被自动判死，不会因为它快就选中
#
# 只写 base_url 时行为与以前完全一致；base_urls 里的第一个会自动当 base_url。
# 同一组的必须是「同一家的域名 + 同一套 Key」，不同厂商别混在一起。
# ---------------------------------------------------------------------------

# [[upstreams]]
# name = "dli-deepseek"
# id = "u6"
# base_url = "https://api.dlizz.com/v1"     # 主地址（列表里的第一条）
# base_urls = [                              # 可选：多线路，一行一条
#   "https://api.dlizz.com/v1",
#   "https://api.dli.li/v1",
#   "https://us-v1.dli.li/v1",
#   "https://us-v1.dlizz.com/v1",
#   "https://hk-v1.dli.li/v1",
#   "https://hk-v1.dlizz.com/v1",
#   "https://us-1.dli.li/v1",
# ]
# mirror_strategy = "fastest"                # fastest（默认）| priority | round_robin
# mirror_fail_threshold = 3                  # 某条连续失败几次踢出
# mirror_cooldown_seconds = 30               # 踢出多久（秒）
# api_key = "sk-你的key"

# 全局控制后台线路探测（不写就是下面这些默认值）
# [mirror_probe]
# enabled = true
# interval_seconds = 15      # 每轮间隔
# timeout_seconds = 2.5      # 单条线路的超时；全并行，所以一轮最多 ≈ 这个时间


# ---------------------------------------------------------------------------
# 也可以在这里预先写好分组路由（可选）。
# 网页上配好的内容会覆盖这里，所以平时用网页配就行。
#
# 注意 entries 里的 model 是「上游那边的真实名字」，而分组名（下面的键）
# 才是客户端调用的名字 —— 各家把 deepseek 叫成不同名字时，就靠这个对应关系。
#
# entries 里的 quota 可省略：
#   不写        = 不限量（默认）
#   0           = 这家不调用（请求时跳过，排序时沉到最后）
#   大于 0 的数 = 记一个上限（只作记录，不会自动停用；停用请填 0）
#
# orderings 里可以预存几套具名排序（名字 → 成员顺序），
# 平时用网页上的「保存当前顺序为…」「按测速重排并保存」更省事。
# ---------------------------------------------------------------------------

# [models."deepseek"]              # 客户端用这个名字调用
# strategy = "priority"            # priority | round_robin | random
# entries = [
#   { upstream = "u1", model = "ds1" },                        # A 家叫 ds1
#   { upstream = "u2", model = "ds2" },                        # B 家叫 ds2
#   { upstream = "u3", model = "deepseek-ai/DeepSeek-V3", quota = 0 },  # C 家这个先不用
# ]
# [models."deepseek".orderings]    # 可选：预存排序（顺序里写 upstream + model）
# "原始" = [
#   { upstream = "u1", model = "ds1" },
#   { upstream = "u2", model = "ds2" },
#   { upstream = "u3", model = "deepseek-ai/DeepSeek-V3" },
# ]
#
# [models."glm"]
# strategy = "round_robin"
# entries = [
#   { upstream = "u2", model = "zai-org/GLM-4.6" },
#   { upstream = "u3", model = "glm-4-6" },
# ]
