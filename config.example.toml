# llm-router 配置示例
#
# 这个文件现在只需要填两件事：监听设置 + 上游列表（名字/地址/Key）。
# 模型的调用顺序不用在这里写 —— 启动后打开网页控制台
# http://127.0.0.1:8010/ ，点「拉取模型」，再按模型排顺序就行。
#
# 网页上的改动会存到 config.state.json（不动这个文件），重启后依然有效。

[server]
host = "127.0.0.1"      # 只给自己用就保持默认；想让局域网别的机器用填 "0.0.0.0"
port = 8010
log_requests = true
max_body_mb = 32
# enable_cors = false   # 浏览器前端直连时才需要打开

[router]
# 新建模型路由时的默认调用方式，网页上可随时改
default_strategy = "priority"    # priority | round_robin | random

# 一个上游连续失败几次后暂时踢出队列
failure_threshold = 3
# 踢出后多久自动恢复（秒）
cooldown_seconds = 60

# 请求明细保留多少条（网页「请求记录」列表能翻出多少条）。
# 这只限制**明细列表**，不影响统计口径：总请求数、成功/失败次数、
# token 用量都是全量累计，按天汇总存在 .llmrouter/<配置名>.stats.json 里，
# 重启不清零，明细被裁掉多少都不会让统计数字变小。
history_limit = 500

# 分组里所有上游都撞上「并发/速率上限」时，最多等多久碰运气（秒）。
# 等到了就发出去，等不到才回 429 capacity_exhausted。
# 设 0 = 不等，立刻回 429。平时撞上限会自动换下一家，不会让请求失败。
queue_timeout_seconds = 15


# ---------------------------------------------------------------------------
# 上游出口：直连 / 规则 / 强制代理
#
# 为什么要这个：Clash Verge 一开 TUN 模式，进程「自己不设代理」并不等于直连 ——
# TUN 在网络层把所有 TCP 都接走了，最后走直连还是走节点，由 Clash 的规则决定。
# 于是「规则模式一开，所有上游都过代理」，本来就该直连的那几家会慢到没法用。
#
# 这里给三个本地端口，每个上游（[[upstreams]] 里的 net_mode）各自选走哪条：
#   net_mode = "direct"  直连 —— 用下面的 direct 端口（Clash 里 proxy: DIRECT 的监听器）
#   net_mode = "rule"    规则 —— 用 rule 端口，去处交给 Clash 规则
#   net_mode = "proxy"   强制代理 —— 用 proxy 端口，绑死一个策略组，绕开规则
#   net_mode = "inherit" 跟随 default_mode（默认）
# 不写这段 = 完全不加干预，行为和以前一样。
#
# 三个端口填好之后，网页「设置 → 上游网络出口」可以一键测出每个上游走哪条最快，
# 再按结果分别钉死；那一页也有现成的 listeners 片段可以直接粘进 Clash。
#
# [proxy]
# enabled = true
# default_mode = "rule"                      # rule | direct | proxy
# rule = "http://127.0.0.1:7897"             # Clash 混合端口（规则决定去处）
# proxy = "http://127.0.0.1:7898"            # 绑死策略组的端口
# direct = "http://127.0.0.1:7899"           # Clash 里 proxy: DIRECT 的端口
#
# 对应的 Clash 侧配置（粘到 mihomo / Clash Verge 的配置里再重载）：
#
# listeners:
#   - name: llm-router-direct
#     type: mixed
#     port: 7899
#     listen: 127.0.0.1
#     proxy: DIRECT          # 出口写死 DIRECT，规则和 TUN 都插不上手
#   - name: llm-router-proxy
#     type: mixed
#     port: 7898
#     listen: 127.0.0.1
#     proxy: 节点选择         # 改成你自己的策略组名
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# 上游来源：有几个写几个，[[upstreams]] 可以重复很多组
#
# 这里不用写模型清单。启动后点「拉取全部模型」，
# 程序会去问每个上游自己有哪些模型，然后你在每个上游卡片上
# 勾选要用的模型（默认一个都不选），并给它们起统一的分组名。
#
# 分组名 = 客户端调用的名字。各家把同一个模型叫成不同名字时
# （比如 A 叫 ds1、B 叫 ds2），把分组名都填成 deepseek 就合并成一个了。
# ---------------------------------------------------------------------------

# --- DeepSeek 官方 ---
[[upstreams]]
name = "DeepSeek 官方"
id = "u1"
base_url = "https://api.deepseek.com"
api_key = "sk-你的官方key"
# 出口：direct 直连 / rule 规则 / proxy 强制代理 / inherit 跟随全局（默认）
# net_mode = "direct"
# 也可以只给这一家指定一个代理地址（留空 = 用 [proxy] 里那三个端口）
# proxy_url = "http://127.0.0.1:7898"

# --- 硅基流动 ---
[[upstreams]]
name = "硅基流动"
id = "u2"
base_url = "https://api.siliconflow.cn/v1"
api_key = "sk-你的硅基流动key"

# --- 火山方舟 ---
[[upstreams]]
name = "火山方舟"
id = "u3"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "你的火山key"

# ---------------------------------------------------------------------------
# 接口类型（api_mode）：这个上游认哪一套 OpenAI 接口
#
#   chat        → /v1/chat/completions（默认，不写就是这个）
#   responses   → /v1/responses（OpenAI Responses API）
#
# 有的上游/中转只开了一套。典型报错：
#   「模型 gpt-6.1-sol 不支持 /v1/chat/completions 接口，
#     请改用 /v1/responses（OpenAI Responses API）」
# 遇到这种就把那个上游的 api_mode 改成 responses：
#   · 客户端**不用改**，照旧调 /v1/chat/completions
#   · 代理负责三个方向的转换：请求体（messages→input、
#     tools/tool_choice/max_tokens 换名）、非流式响应（output[]→choices）、
#     流式事件（response.output_text.delta→chat.completion.chunk）
#   · 测速、详细测试也跟着走 /v1/responses，卡片不会因此变红
#
# 客户端自己就在用 /v1/responses 时是纯透传，不做转换。
# ---------------------------------------------------------------------------

# [[upstreams]]
# name = "只开 Responses 的中转"
# id = "u7"
# base_url = "https://api.example.com/v1"
# api_key = "sk-..."
# api_mode = "responses"


